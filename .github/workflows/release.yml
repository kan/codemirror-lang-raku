# Registers a GitHub release when a version tag is pushed. Publishing to
# npm is done by hand, before the tag is pushed: this workflow only checks
# that the version is there, and holds no npm credentials.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The history, to see that the tag is on main.
          fetch-depth: 0
          # The dependencies and the tests do not get the token.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag is the version of package.json, on main
        id: package
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match version $version of package.json"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The commit of $TAG is not on main"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.js > "$RUNNER_TEMP/notes.md"
      - run: npm ci
      - run: npm test
      - name: Wait for the version to be on npm
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          # A published version can take a few minutes to show up.
          for attempt in $(seq 1 20); do
            published="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ]; then break; fi
            if [ "$attempt" = 20 ]; then
              echo "::error::$NAME@$VERSION is not on npm. Run npm publish, then run this workflow again"
              exit 1
            fi
            echo "$NAME@$VERSION is not on npm yet (attempt $attempt of 20)"
            sleep 30
          done
          # npm records the commit that a version was published from.
          head="$(npm view "$NAME@$VERSION" gitHead 2>/dev/null || true)"
          if [ -z "$head" ]; then
            echo "::warning::npm has no commit on record for $NAME@$VERSION, so it was not compared with the tag"
          elif [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$NAME@$VERSION was published from commit $head, but $TAG is commit $GITHUB_SHA"
            exit 1
          fi
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          # A version like 1.0.0-rc.1 is a prerelease.
          case "$VERSION" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$prerelease"
          else
            gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$prerelease"
          fi
