name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # scripts/tagpr/ (a git subtree of kan/tagpr-scripts) and the commit
      # that tagpr.yml and tagpr-label.yml call are the same. Uses no
      # dependencies, so it comes before npm ci.
      - name: Check scripts/tagpr/ against the tagpr workflow pin
        run: node scripts/tagpr/verify-subtree.mjs
      - run: npm ci
      - run: npm test
      # The files that would be published.
      - run: npm pack --dry-run
