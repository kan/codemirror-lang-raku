# Stages a version tag on npm, then registers its GitHub release. The jobs
# are the shared workflow of kan/tagpr-scripts ("The npm publish workflow" of
# scripts/tagpr/README.md). Keep the name of this file: the Trusted Publisher
# on npm is registered with it.
#
# tagpr.yml starts this with workflow_dispatch on the tag it made for a merged
# release pull request: a tag pushed with GITHUB_TOKEN does not start
# "push: tags". "push: tags" is for a tag pushed again by hand.
#
# The version is staged with npm stage publish, and is public only once a
# maintainer approves it (npm stage approve <stage ID>, with 2FA). The summary
# of the run shows the stage ID. The steps are in AGENTS.md ("公開の手順").
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One run per tag, never cancelled: stopped halfway, a version could be on
# npm with no release.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # The same commit as scripts/tagpr/ (test.yml checks it with verify-subtree.mjs)
    uses: kan/tagpr-scripts/.github/workflows/publish-npm.yml@f95892b128286dd1f84eea57f1e08a17e1f26eb3
    permissions:
      contents: write  # checkout and the GitHub release
      id-token: write  # npm Trusted Publishing
    with:
      check: npm test
      # npm test has built dist/ (pretest), so pack that same build without
      # running prepare again
      pack-ignore-scripts: true
