version: 2
updates:
  # Updates the npm dependencies. All of them go into one PR: every PR touches
  # package-lock.json, so separate PRs conflict with each other after one is merged.
  #
  # versioning-strategy: this package is a library, and the lower bound of a range in
  # "dependencies" decides which versions its users can have. increase-if-necessary keeps a
  # range as it is while the new version is inside it (only package-lock.json changes), and
  # rewrites it only when the new version is outside it (a new major).
  #
  # cooldown: only take a version some days after it is published. A broken or hijacked release
  # is usually pulled within a few days. Security updates are not delayed by it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # With TypeScript 7.0, @rollup/plugin-typescript (12.3.1) throws while rollup loads the
      # config ("Cannot read properties of undefined (reading 'ES2015')", PR #18), so the build
      # fails. Only 7.0.x is ignored, so the PR for 7.1 still comes and CI decides whether it
      # works. If 7.1 still fails, add 7.1.x here.
      - dependency-name: typescript
        versions: ["7.0.x"]
    groups:
      npm:
        patterns:
          - "*"
  # Updates the actions of .github/workflows. The PRs also rewrite the entries of
  # .github/workflows/actions.lock.
  #
  # cooldown: only take a version 3 days after it is published. A broken or hijacked release is
  # usually pulled within a few days. Security updates are not delayed by it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
